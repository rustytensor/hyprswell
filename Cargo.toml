[package]
name = "hyprswell"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
gtk4-layer-shell = "0.7"
glib = "0.21"
gio = { version = "0.21", features = ["v2_74"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.dev]
debug = 0
